[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[project]
name = "larex-action"
version = "0.1.0"
description = "Calculate binary and normalized versions of a set of input images using OCRopus nlbin algorithm."
readme = "README.md"
authors = [
    { name = "OCR4all", email = "ocr4all@uni-wuerzburg.de" }
]
requires-python = ">=3.12"
dependencies = [
    "larex-action-sdk[fastapi]>=0.26.0",
    "nlbin[cuda12ctk]",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
nlbin = { git = "https://github.com/jahtz/nlbin.git", branch = "larex-action" }
